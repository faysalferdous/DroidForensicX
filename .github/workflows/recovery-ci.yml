name: Recovery CI
on:
  pull_request:
  push:
    branches: [main, feature/universal-file-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: droidforensicx recover-all --help
  offline-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y sleuthkit testdisk dosfstools mtools
      - run: python -m pip install -e '.[dev]'
      - run: DFX_ENGINE_TEST=1 python -m pytest tests/test_recovery_integration.py -q
