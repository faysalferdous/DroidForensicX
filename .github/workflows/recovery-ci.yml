name: Recovery CI
on:
  pull_request:
  push:
    branches: [main, feature/universal-file-recovery, fix/security-stability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: droidforensicx recover-all --help
  offline-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y sleuthkit testdisk dosfstools mtools
      - run: python -m pip install -e '.[dev]'
      - run: DFX_ENGINE_TEST=1 python -m pytest tests/test_recovery_integration.py -q

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m venv /tmp/dfx-wheel-test
          /tmp/dfx-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/dfx-wheel-test/bin/droidforensicx --help
          /tmp/dfx-wheel-test/bin/droidforensicx demo --case PACKAGE-SMOKE
          test -s cases/PACKAGE-SMOKE/14_reports/report.html
